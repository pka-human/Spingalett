<title id="t">Spingalett on CUDA against llama.cpp on Vulkan, tokens a second</title>
<desc id="d">Five GGUF models on an RTX 4050 Laptop GPU. Spingalett processes prompts 1.21 to 1.37 times as fast; generation is level, 0.99 to 1.12 times. The README's table holds the numbers.</desc>
