name: Release

# Builds, tests and packages the library on every supported platform, Python wheels with the library
# inside, and DigitPad as a Linux AppImage and a Windows zip around one trained model. On a pull
# request this only checks that everything builds and packages; pushing a tag vX.Y.Z publishes a
# GitHub release with the files, and the wheels on PyPI when the repository variable PYPI_PUBLISH is
# "true" (trusted publishing: PyPI must list this repository, release.yml and the environment "pypi"
# as a publisher of the project). workflow_dispatch (re)publishes an existing tag, optionally without
# binaries for versions that predate this workflow. Only the highest version is marked as the
# latest release. Pushes to dev/ branches build and test everything like a pull request, without
# publishing. Every package and wheel holds the Vulkan GPU backend (the runners have no GPU: its
# tests are skipped there; CI runs them on Mesa's lavapipe).

on:
  push:
    tags: ['v*']
    branches: ['dev/**']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.4.1
        required: true
      binaries:
        description: Build and attach binaries
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
      publish: ${{ steps.v.outputs.publish }}
      binaries: ${{ steps.v.outputs.binaries }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - id: v
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^project(Spingalett VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          publish=false; binaries=true; ref=$GITHUB_SHA
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=true
            ref=$TAG
            if [ "$TAG" != "v$version" ]; then
              echo "::error::tag $TAG does not match the project version $version"
              exit 1
            fi
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.binaries }}" != true ]; then binaries=false; fi
          { echo "version=$version"; echo "ref=$ref"; echo "publish=$publish"; echo "binaries=$binaries"; } >> "$GITHUB_OUTPUT"

  package:
    needs: [version, shaders]
    if: needs.version.outputs.binaries == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,      os: ubuntu-24.04,     flags: '' }
          - { name: linux-x86_64-v3,   os: ubuntu-24.04,     flags: '-march=x86-64-v3' }
          - { name: linux-aarch64,     os: ubuntu-24.04-arm, flags: '' }
          - { name: windows-x86_64,    os: windows-2022,     flags: '' }
          - { name: windows-x86_64-v3, os: windows-2022,     flags: '-march=x86-64-v3' }
          - { name: macos-universal,   os: macos-14,         flags: '' }
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    env:
      ARCHIVE: spingalett-${{ needs.version.outputs.version }}-${{ matrix.name }}
      RUNTIME_ARCHIVE: spingalett-runtime-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      # the shaders, compiled once with a recent glslc (bfloat16 on the matrix units needs one)
      - uses: actions/download-artifact@v4
        with:
          name: spirv
          path: spirv

      - name: MSYS2 (UCRT64 GCC)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-tools-git mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-vulkan-headers zip

      # the GPU backend: glslc and the Vulkan headers (Vulkan itself is opened at run time)
      - name: Shader compiler and Vulkan headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslc libvulkan-dev

      - name: Shader compiler and Vulkan headers (macOS)
        if: runner.os == 'macOS'
        run: brew install shaderc vulkan-headers

      - name: OpenMP runtime (MSYS2)
        if: runner.os == 'Windows'
        run: |
          # GCC's libgomp may come in its own package; install it when the repository has one
          for p in mingw-w64-ucrt-x86_64-gcc-libgomp mingw-w64-ucrt-x86_64-libgomp; do
            if pacman -Si "$p" > /dev/null 2>&1; then pacman -S --noconfirm --needed "$p"; fi
          done
          pacman -Ss gomp || true
          ls /ucrt64/bin/libgomp* /ucrt64/lib/libgomp* /ucrt64/lib/gcc/x86_64-w64-mingw32/*/libgomp* 2>/dev/null || true

      # Apple's compilers come without an OpenMP runtime, and Homebrew's is built for the runner's
      # macOS: build LLVM's for both architectures and macOS 11, and ship it in the package
      - name: OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        id: libomp
        uses: actions/cache@v4
        with:
          path: libomp
          key: libomp-19.1.7-universal-macos11

      - name: Build the OpenMP runtime (macOS)
        if: runner.os == 'macOS' && steps.libomp.outputs.cache-hit != 'true'
        run: |
          v=19.1.7
          base=https://github.com/llvm/llvm-project/releases/download/llvmorg-$v
          mkdir -p omp-src
          curl -fsSL "$base/openmp-$v.src.tar.xz" | tar -xJ -C omp-src
          curl -fsSL "$base/cmake-$v.src.tar.xz" | tar -xJ -C omp-src
          mv "omp-src/cmake-$v.src" omp-src/cmake
          cmake -S "omp-src/openmp-$v.src" -B omp-build -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DOPENMP_STANDALONE_BUILD=ON -DLIBOMP_INSTALL_ALIASES=OFF -DLIBOMP_OMPD_SUPPORT=OFF \
            -DOPENMP_ENABLE_LIBOMPTARGET=OFF -DOPENMP_ENABLE_OMPT_TOOLS=OFF -DLIBOMP_OMPT_SUPPORT=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/libomp"
          cmake --build omp-build --parallel
          cmake --install omp-build
          cp "omp-src/openmp-$v.src/LICENSE.TXT" libomp/LICENSE-libomp.txt
          install_name_tool -id @rpath/libomp.dylib libomp/lib/libomp.dylib
          lipo -info libomp/lib/libomp.dylib
          otool -l libomp/lib/libomp.dylib | grep -A4 LC_BUILD_VERSION | head -8

      # The library (with the runtime next to it), and the runtime alone for its own archive: the same
      # flags, without the GPU backend
      - name: Configure
        run: |
          root=$PWD; [ "$RUNNER_OS" = Windows ] && root=$(cygpath -m "$PWD")    # native CMake, MSYS shell
          args=(-DCMAKE_BUILD_TYPE=Release -DSPINGALETT_NATIVE_ARCH=OFF "-DCMAKE_C_FLAGS=${{ matrix.flags }}")
          library=(-DCMAKE_INSTALL_PREFIX="$root/$ARCHIVE" -DSPINGALETT_VULKAN=ON -DSPINGALETT_SPIRV_DIR="$root/spirv")
          runtime=(-DCMAKE_INSTALL_PREFIX="$root/$RUNTIME_ARCHIVE" -DSPINGALETT_RUNTIME_ONLY=ON
                   -DSPINGALETT_BIN_DIR="$root/BuildRuntime/Bin" -DSPINGALETT_LIB_DIR="$root/BuildRuntime/Lib")
          case "${{ matrix.name }}" in
            macos-*)   omp="$PWD/libomp"
                       library+=("-DSPINGALETT_VULKAN_INCLUDE=$(brew --prefix vulkan-headers)/include")
                       args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
                              -DBUILD_WITH_OPENMP=ON "-DOpenMP_C_FLAGS=-Xclang -fopenmp -I$omp/include"
                              -DOpenMP_C_LIB_NAMES=omp "-DOpenMP_omp_LIBRARY=$omp/lib/libomp.dylib") ;;
            windows-*) args+=(-G Ninja -DBUILD_WITH_OPENMP=ON) ;;
            *)         args+=(-DBUILD_WITH_OPENMP=ON) ;;
          esac
          cmake -S . -B Build "${args[@]}" "${library[@]}"
          cmake -S . -B BuildRuntime "${args[@]}" "${runtime[@]}"
          # OpenMP is requested everywhere: a build without it must not be published
          for build in Build BuildRuntime; do
            if ! grep -q "define SPINGALETT_HAS_OPENMP" $build/Spingalett/Spingalett.Config.h; then
              grep -n -i -B2 -A25 "openmp" $build/CMakeFiles/CMakeConfigureLog.yaml | tail -120 || true
              echo "::error::OpenMP was requested but not found ($build)"
              exit 1
            fi
          done

      - name: Build
        run: |
          cmake --build Build --parallel
          cmake --build BuildRuntime --parallel

      - name: Test
        run: |
          ctest --test-dir Build --output-on-failure
          ctest --test-dir BuildRuntime --output-on-failure

      - name: Install
        run: |
          cmake --install Build
          cmake --install BuildRuntime
          for dir in "$ARCHIVE" "$RUNTIME_ARCHIVE"; do cp LICENSE CHANGELOG.md README.md "$dir/"; done
          if [ "$RUNNER_OS" = Windows ]; then
            # the MinGW runtime DLLs the libraries and the tools load (libgomp, libwinpthread, ...)
            ldd "$ARCHIVE/bin/libspingalett.dll" "$ARCHIVE/bin/libspingalett-runtime.dll" \
                "$ARCHIVE/bin/DatasetTool.exe" "$ARCHIVE/bin/ModelTool.exe" |
              awk '$3 ~ /^\/ucrt64\// { print $3 }' | sort -u | xargs -r cp -t "$ARCHIVE/bin/"
            ldd "$RUNTIME_ARCHIVE/bin/libspingalett-runtime.dll" "$RUNTIME_ARCHIVE/bin/RunModel.exe" |
              awk '$3 ~ /^\/ucrt64\// { print $3 }' | sort -u | xargs -r cp -t "$RUNTIME_ARCHIVE/bin/"
            ls "$ARCHIVE/bin" "$RUNTIME_ARCHIVE/bin"
            (cd "$ARCHIVE/lib" && gendef ../bin/libspingalett.dll && mv libspingalett.def spingalett.def &&
             gendef ../bin/libspingalett-runtime.dll && mv libspingalett-runtime.def spingalett-runtime.def)
            (cd "$RUNTIME_ARCHIVE/lib" && gendef ../bin/libspingalett-runtime.dll &&
             mv libspingalett-runtime.def spingalett-runtime.def)
          fi
          if [ "$RUNNER_OS" = macOS ]; then
            # the OpenMP runtime next to the libraries, which find it through @loader_path
            for dir in "$ARCHIVE" "$RUNTIME_ARCHIVE"; do
              cp libomp/lib/libomp.dylib "$dir/lib/"
              cp libomp/LICENSE-libomp.txt "$dir/"
            done
            otool -L "$ARCHIVE"/lib/libspingalett.*.dylib "$RUNTIME_ARCHIVE"/lib/libspingalett-runtime.*.dylib
            otool -l "$ARCHIVE"/lib/libspingalett.*.dylib | grep -A2 LC_RPATH
            for tool in "$ARCHIVE/bin/ModelTool" "$RUNTIME_ARCHIVE/bin/RunModel"; do
              out=$("$tool" 2>&1 || true)                           # usage: the tool and its libraries load
              echo "$out" | head -3
              if echo "$out" | grep -q "Library not loaded"; then
                echo "::error::$tool cannot load its libraries"
                exit 1
              fi
            done
          fi

      - name: MSVC import library
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: MSVC import library and consumer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          lib /nologo /def:$env:ARCHIVE\lib\spingalett.def /name:libspingalett.dll /machine:x64 /out:$env:ARCHIVE\lib\spingalett.lib
          foreach ($dir in $env:ARCHIVE, $env:RUNTIME_ARCHIVE) {
            lib /nologo /def:$dir\lib\spingalett-runtime.def /name:libspingalett-runtime.dll /machine:x64 /out:$dir\lib\spingalett-runtime.lib
            Remove-Item $dir\lib\*.exp -ErrorAction SilentlyContinue
          }
          # an MSVC program links against the MinGW-built DLL through the import library
          cl /nologo /std:c11 /I $env:ARCHIVE\include Examples\XOR.c /Fe:xor_msvc.exe /link $env:ARCHIVE\lib\spingalett.lib
          cl /nologo /std:c11 /I $env:RUNTIME_ARCHIVE\include packaging\conan\test_package\test_runtime.c /Fe:runtime_msvc.exe /link $env:RUNTIME_ARCHIVE\lib\spingalett-runtime.lib
          $env:PATH = "$PWD\$env:ARCHIVE\bin;$env:PATH"
          .\xor_msvc.exe | Select-String "Passed"
          $env:PATH = "$PWD\$env:RUNTIME_ARCHIVE\bin;$env:PATH"
          .\runtime_msvc.exe | Select-String "Spingalett runtime"

      - name: Consumer (find_package)
        run: |
          mkdir consumer
          cp Examples/XOR.c consumer/xor.c
          cp Examples/Runtime/RunModel.c consumer/run.c
          printf '%s\n' 'cmake_minimum_required(VERSION 3.21)' 'project(consumer C)' \
            'find_package(Spingalett ${{ needs.version.outputs.version }} REQUIRED)' \
            'add_executable(xor xor.c)' 'target_link_libraries(xor PRIVATE Spingalett::spingalett)' \
            'add_executable(run run.c)' 'target_link_libraries(run PRIVATE Spingalett::runtime)' > consumer/CMakeLists.txt
          root=$PWD; gen=()
          if [ "$RUNNER_OS" = Windows ]; then root=$(cygpath -m "$PWD"); gen=(-G Ninja); fi
          cmake -S consumer -B consumer/build "${gen[@]}" -DCMAKE_PREFIX_PATH="$root/$ARCHIVE"
          cmake --build consumer/build
          export PATH="$PWD/$ARCHIVE/bin:$PATH"
          (cd consumer/build && ./xor | grep "Passed: 4/4")
          consumer/build/run Tests/Data/runtime/graph5_fp32.slett | tail -1     # the runtime next to the library
          if [ "$RUNNER_OS" != Windows ] && command -v pkg-config > /dev/null; then   # spingalett.pc, relocated
            export PKG_CONFIG_PATH="$PWD/$ARCHIVE/lib/pkgconfig"
            test "$(pkg-config --modversion spingalett)" = "${{ needs.version.outputs.version }}"
            cc -o consumer/xor_pc consumer/xor.c $(pkg-config --cflags --libs spingalett) -lm \
               -Wl,-rpath,"$PWD/$ARCHIVE/lib"
            (cd consumer && ./xor_pc | grep "Passed: 4/4")
          fi
          { "$ARCHIVE/bin/DatasetTool" || true; } 2>&1 | grep -q usage      # no arguments: usage, exit 2
          { "$ARCHIVE/bin/ModelTool" || true; } 2>&1 | grep -q usage

      - name: Consumer of the runtime (find_package, pkg-config)
        run: |
          mkdir runtime-consumer
          cp Examples/Runtime/RunModel.c runtime-consumer/
          printf '%s\n' 'cmake_minimum_required(VERSION 3.21)' 'project(consumer C)' \
            'find_package(Spingalett ${{ needs.version.outputs.version }} REQUIRED)' \
            'add_executable(run RunModel.c)' 'target_link_libraries(run PRIVATE Spingalett::runtime)' \
            > runtime-consumer/CMakeLists.txt
          root=$PWD; gen=()
          if [ "$RUNNER_OS" = Windows ]; then root=$(cygpath -m "$PWD"); gen=(-G Ninja); fi
          # only the runtime: the archive has neither the library nor its header
          test ! -e "$RUNTIME_ARCHIVE/include/Spingalett/Spingalett.h"
          cmake -S runtime-consumer -B runtime-consumer/build "${gen[@]}" -DCMAKE_PREFIX_PATH="$root/$RUNTIME_ARCHIVE"
          cmake --build runtime-consumer/build
          export PATH="$PWD/$RUNTIME_ARCHIVE/bin:$PATH"
          runtime-consumer/build/run Tests/Data/runtime/resnet_int8.slett
          "$RUNTIME_ARCHIVE/bin/RunModel" Tests/Data/runtime/cnn_fp32.slett | tail -1
          if [ "$RUNNER_OS" != Windows ] && command -v pkg-config > /dev/null; then   # spingalett-runtime.pc
            export PKG_CONFIG_PATH="$PWD/$RUNTIME_ARCHIVE/lib/pkgconfig"
            test "$(pkg-config --modversion spingalett-runtime)" = "${{ needs.version.outputs.version }}"
            cc -std=c99 -Wall -Wextra -Wpedantic -Werror -o runtime-consumer/pc \
               packaging/conan/test_package/test_runtime.c $(pkg-config --cflags --libs spingalett-runtime) \
               -Wl,-rpath,"$PWD/$RUNTIME_ARCHIVE/lib"
            runtime-consumer/pc
          fi

      - name: Archive
        run: |
          for dir in "$ARCHIVE" "$RUNTIME_ARCHIVE"; do
            if [ "$RUNNER_OS" = Windows ]; then zip -qr "$dir.zip" "$dir"; else tar -czf "$dir.tar.gz" "$dir"; fi
          done
          ls -l "$ARCHIVE".* "$RUNTIME_ARCHIVE".*

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE }}.*
            ${{ env.RUNTIME_ARCHIVE }}.*
          if-no-files-found: error

      # Python wheels from the baseline macOS and Windows builds (Linux wheels: the wheels job)
      - uses: actions/setup-python@v5
        if: matrix.name == 'macos-universal' || matrix.name == 'windows-x86_64'
        with:
          python-version: '3.12'
      - name: Wheel
        if: matrix.name == 'macos-universal' || matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          python -m pip install --quiet build wheel numpy
          rm -f Bindings/Python/spingalett/*.so* Bindings/Python/spingalett/*.dylib Bindings/Python/spingalett/*.dll
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$ARCHIVE"/bin/*.dll Bindings/Python/spingalett/           # the library and its MinGW runtime
            platform=win_amd64
          else
            cp "$ARCHIVE"/lib/libspingalett.*.dylib "$ARCHIVE"/lib/libomp.dylib Bindings/Python/spingalett/
            platform=macosx_11_0_universal2
          fi
          python -m build --wheel --outdir wheelhouse Bindings/Python
          python -m wheel tags --remove --platform-tag "$platform" wheelhouse/*.whl
          python -m pip install wheelhouse/*.whl
          cd Tests && env -u SPINGALETT_LIBRARY python test_python_bindings.py
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'macos-universal' || matrix.name == 'windows-x86_64'
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # manylinux wheels: the library built in the manylinux 2.28 images (glibc 2.28, any Linux of 2018
  # on), libgomp vendored by auditwheel; x86-64 builds choose AVX2 or AVX-512 kernels at run time
  # The shaders as SPIR-V (the same for every platform), compiled once for every package and wheel:
  # with Arch Linux's shaderc, recent enough for the bfloat16 kernel (Ubuntu's is not, and the
  # manylinux containers have none); each is checked by spirv-val
  shaders:
    needs: version
    if: needs.version.outputs.binaries == 'true'
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed cmake ninja gcc shaderc vulkan-headers spirv-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Compile
        run: |
          glslc --version
          cmake -S . -B Build -G Ninja -DSPINGALETT_VULKAN=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLE=OFF
          cmake --build Build --target spingalett_shaders
          mkdir spirv && cp Build/Gpu/*.spv.inc spirv/
          # every kernel compiled (an empty module would leave the matrix units out of the packages)
          for f in spirv/*.spv.inc; do grep -q 0x07230203 "$f" || { echo "::error::$f is empty"; exit 1; }; done
          for f in Src/Gpu/Shaders/*.comp; do
            glslc --target-env=vulkan1.2 -O -o shader.spv "$f" && spirv-val --target-env vulkan1.2 shader.spv
          done
      - uses: actions/upload-artifact@v4
        with:
          name: spirv
          path: spirv/
          if-no-files-found: error

  wheels:
    needs: [version, shaders]
    if: needs.version.outputs.binaries == 'true'
    name: wheel-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: spirv
          path: spirv
      - name: Build the library
        run: |
          dnf install -y vulkan-headers
          python3.12 -m pip install --quiet cmake ninja build wheel numpy
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          gcc --version | head -1
          cmake -S . -B Build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPINGALETT_NATIVE_ARCH=OFF -DBUILD_WITH_OPENMP=ON \
                -DBUILD_EXAMPLE=OFF -DSPINGALETT_VULKAN=ON -DSPINGALETT_SPIRV_DIR=$PWD/spirv
          cmake --build Build --parallel
          ctest --test-dir Build --output-on-failure -R core
      - name: Wheel
        run: |
          export PATH="/opt/python/cp312-cp312/bin:$PATH"
          cp Bin/libspingalett.so.* Bindings/Python/spingalett/
          python -m build --wheel --outdir dist Bindings/Python
          auditwheel repair --plat manylinux_2_28_${{ matrix.arch }} -w wheelhouse dist/*.whl
          for py in cp310-cp310 cp312-cp312 cp313-cp313; do
            "/opt/python/$py/bin/python" -m pip install --quiet numpy wheelhouse/*.whl
            (cd Tests && env -u SPINGALETT_LIBRARY "/opt/python/$py/bin/python" test_python_bindings.py | tail -1)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - run: |
          python3 -m pip install --quiet build
          python3 -m build --sdist --outdir dist Bindings/Python
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # the inference engine's three source files, for firmware projects
  engine:
    needs: version
    if: needs.version.outputs.binaries == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Archive
        run: |
          dir=spingalett-${{ needs.version.outputs.version }}-inference-engine
          mkdir -p $dir/Include/Spingalett $dir/Src
          cp Include/Spingalett/Spingalett.Inference.h $dir/Include/Spingalett/
          cp Src/Spingalett.Inference.c Src/Spingalett.Engine.h $dir/Src/
          cp LICENSE $dir/
          cp Examples/Embedded/README.md $dir/README.md
          # it must build on its own, as C99, without warnings
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -O2 -DSPINGALETT_INFERENCE_ONLY -I$dir/Include -c $dir/Src/Spingalett.Inference.c -o /dev/null
          zip -qr $dir.zip $dir
          ls -l $dir.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-engine
          path: spingalett-*-inference-engine.zip
          if-no-files-found: error

  # the DigitPad model, trained once for the AppImage and the Windows zip
  model:
    needs: version
    if: needs.version.outputs.binaries == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - name: Train (2 epochs on pull requests, the full 30 for releases)
        run: |
          epochs=30
          [ "${{ needs.version.outputs.publish }}" = true ] || epochs=2
          sh Examples/download_mnist.sh mnist
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DBUILD_APPS=ON -DBUILD_WITH_OPENMP=ON \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLE=OFF
          cmake --build Build --parallel --target DigitPadTrain
          Bin/DigitPadTrain mnist mnist.slett "$epochs"
          cat mnist.slett.info
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: mnist.slett*
          if-no-files-found: error

  appimage:
    needs: [version, model]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model
      - name: Dependencies (SDL2 build headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libwayland-dev libxkbcommon-dev libdecor-0-dev wayland-protocols libegl-dev \
            libgl-dev libgles-dev libdrm-dev libgbm-dev
      - name: Build
        run: Apps/DigitPad/Package/build-appimage.sh --model model/mnist.slett --work build/appimage
      - name: Smoke test
        run: |
          image=$(ls build/appimage/DigitPad-*-x86_64.AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --help | grep -q classify
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --classify Apps/DigitPad/Package/seven.pgm | tee result.txt
          grep -q "^prediction 7 " result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: build/appimage/DigitPad-*-x86_64.AppImage
          if-no-files-found: error

  digitpad-windows:
    needs: [version, model]
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model
      - name: MSYS2 (UCRT64 GCC, SDL2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
      - name: Build
        run: Apps/DigitPad/Package/build-windows-zip.sh --model model/mnist.slett --work build/windows
      - name: Test (command line, then drawing a 7 in the window)
        shell: pwsh
        run: |
          $zip = (Get-Item build/windows/DigitPad-*-windows-x86_64.zip).FullName
          Apps/DigitPad/Package/test-windows-zip.ps1 $zip -Screenshot digitpad-windows.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digitpad-windows-screenshot
          path: digitpad-windows.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: release-digitpad-windows
          path: build/windows/DigitPad-*-windows-x86_64.zip
          if-no-files-found: error

  pypi:
    needs: [version, package, wheels, sdist]
    if: needs.version.outputs.publish == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish:
    needs: [version, package, wheels, sdist, engine, model, appimage, digitpad-windows]
    if: >-
      always() && needs.version.outputs.publish == 'true' &&
      (needs.package.result == 'success' || needs.package.result == 'skipped') &&
      (needs.wheels.result == 'success' || needs.wheels.result == 'skipped') &&
      (needs.engine.result == 'success' || needs.engine.result == 'skipped') &&
      (needs.model.result == 'success' || needs.model.result == 'skipped') &&
      (needs.appimage.result == 'success' || needs.appimage.result == 'skipped') &&
      (needs.digitpad-windows.result == 'success' || needs.digitpad-windows.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.ref }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: actions/checkout@v4          # the notes script may be newer than the tag
        with:
          path: tools
      - uses: actions/download-artifact@v4
        if: needs.version.outputs.binaries == 'true'
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@v4       # the Python wheels, also attached to the release
        if: needs.version.outputs.binaries == 'true'
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - name: Notes and checksums
        run: |
          binaries=${{ needs.version.outputs.binaries == 'true' && '1' || '0' }}
          sh tools/.github/release-notes.sh "$VERSION" "$binaries" > notes.md
          mkdir -p dist
          if [ -n "$(ls dist)" ]; then (cd dist && sha256sum * > SHA256SUMS); fi
          cat notes.md; ls -l dist
      - name: Publish
        run: |
          files=(dist/*); [ -e "${files[0]}" ] || files=()
          # "Latest" only for the highest version, so that publishing an older tag keeps it
          highest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -n 1)
          latest=false; [ "$TAG" = "$highest" ] && latest=true
          echo "highest tag $highest; $TAG latest: $latest"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Spingalett $VERSION" --notes-file notes.md --latest="$latest"
            if [ ${#files[@]} -gt 0 ]; then gh release upload "$TAG" "${files[@]}" --clobber; fi
          else
            gh release create "$TAG" --verify-tag --title "Spingalett $VERSION" --notes-file notes.md \
              --latest="$latest" "${files[@]}"
          fi
