name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.cc }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        config: [minimal, full, generic]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # glslc and the Vulkan headers build the GPU backend; Mesa's lavapipe (a Vulkan device on
          # the CPU) runs its tests
          sudo apt-get install -y libopenblas-dev libomp-dev python3-numpy libsdl2-dev \
            glslc libvulkan-dev mesa-vulkan-drivers

      - name: Configure
        run: |
          extra="-DBUILD_APPS=ON -DSPINGALETT_VULKAN=ON"
          if [ "${{ matrix.config }}" = full ]; then
            extra="$extra -DBUILD_WITH_OPENMP=ON -DBUILD_WITH_OPENBLAS=ON"
          elif [ "${{ matrix.config }}" = generic ]; then
            # baseline x86-64: the portable code paths, and GEMM kernels chosen at run time
            # (the GEMM test runs the baseline, AVX2 and AVX-512 sets the runner supports)
            extra="$extra -DSPINGALETT_NATIVE_ARCH=OFF -DBUILD_WITH_OPENMP=ON -DBUILD_WITH_OPENBLAS=ON"
          fi
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} $extra

      - name: Build
        run: cmake --build Build --parallel

      - name: Test
        run: .github/scripts/ctest.sh --test-dir Build

      # ctest counts the GPU tests as passed when they find no device: here they must find lavapipe
      - name: GPU tests (lavapipe)
        run: |
          Bin/SpingalettGpuTests | tee gpu-kernels.txt
          Bin/SpingalettTests gpu | tee gpu-group.txt
          grep -q "^device: llvmpipe" gpu-kernels.txt && grep -q "device: llvmpipe" gpu-group.txt

      - name: Examples
        working-directory: Bin
        run: |
          ./XOR
          ./DigitPad --help

  # Ubuntu's glslc is too old for the bfloat16 kernel, which the builds above leave out: the shaders
  # compile with Arch Linux's and pass spirv-val
  shaders:
    name: shaders (recent glslc)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed cmake ninja gcc shaderc vulkan-headers spirv-tools
      - uses: actions/checkout@v4
      - name: Compile and validate
        run: |
          glslc --version
          for f in Src/Gpu/Shaders/*.comp; do
            echo "$f"
            glslc --target-env=vulkan1.2 -O -o shader.spv "$f" && spirv-val --target-env vulkan1.2 shader.spv
          done
          cmake -S . -B Build -G Ninja -DSPINGALETT_VULKAN=ON -DBUILD_TESTS=OFF -DBUILD_EXAMPLE=OFF
          cmake --build Build --target spingalett_shaders
          for f in Build/Gpu/*.spv.inc; do grep -q 0x07230203 "$f" || { echo "::error::$f is empty"; exit 1; }; done

  sanitizers:
    name: ${{ matrix.cc }} / ASan + UBSan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, cxx: g++ }
          - { cc: clang, cxx: clang++ }       # Clang's UBSan also checks offsets applied to null pointers
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev libomp-dev

      - name: Configure
        run: >
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DBUILD_WITH_OPENMP=ON -DBUILD_WITH_OPENBLAS=ON
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build Build --parallel

      - name: Test
        run: LSAN_OPTIONS=suppressions=$PWD/Tests/lsan.supp .github/scripts/ctest.sh --test-dir Build

  # the bindings of other languages against the library, installed: their tests, and their structures' layout
  # against the C compiler's (SpingalettLayout)
  bindings:
    name: bindings (Rust, .NET, Go, Java)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: The library
        run: |
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DSPINGALETT_NATIVE_ARCH=OFF -DBUILD_WITH_OPENMP=ON \
            -DBUILD_APPS=OFF -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build Build --parallel
          cmake --install Build
          echo "LD_LIBRARY_PATH=$PWD/prefix/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$PWD/prefix/lib/pkgconfig" >> $GITHUB_ENV
          echo "SPINGALETT_LIB_DIR=$PWD/prefix/lib" >> $GITHUB_ENV
          echo "SPINGALETT_LAYOUT=$PWD/Bin/SpingalettLayout" >> $GITHUB_ENV

      - name: Rust
        working-directory: Bindings/Rust
        run: cargo test

      - name: .NET
        working-directory: Bindings/CSharp
        run: dotnet run --project Spingalett.Tests -c Release

      - name: Go
        working-directory: Bindings/Go
        run: go vet ./... && go test ./...

      - name: Java
        working-directory: Bindings/Java
        run: mvn -B -q test

  inference-only:
    name: inference engine alone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The engine as C99, C11 and C17 (gcc, clang)
        run: |
          for cc in gcc clang; do
            for std in c99 c11 c17; do
              $cc -std=$std -Wall -Wextra -Wpedantic -Werror -O2 -DSPINGALETT_INFERENCE_ONLY \
                -IInclude -ISrc -c Src/Spingalett.Inference.c -o /dev/null
            done
          done

      - name: Configure, build, test (SPINGALETT_INFERENCE_ONLY)
        run: |
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DSPINGALETT_INFERENCE_ONLY=ON -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build Build --parallel
          .github/scripts/ctest.sh --test-dir Build
          cmake --install Build

      - name: Consumer (find_package)
        run: |
          mkdir consumer
          printf '%s\n' 'cmake_minimum_required(VERSION 3.21)' 'project(consumer C)' \
            'find_package(Spingalett REQUIRED)' 'add_executable(c main.c)' \
            'target_link_libraries(c PRIVATE Spingalett::spingalett)' > consumer/CMakeLists.txt
          printf '%s\n' '#include <Spingalett/Spingalett.Inference.h>' \
            'int main(void) { SpingalettModel m; return spingalett_model_init(&m, "x", 1) == SPINGALETT_ERR_INVALID ? 0 : 1; }' \
            > consumer/main.c
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH=$PWD/prefix
          cmake --build consumer/build
          consumer/build/c

  runtime:
    name: ${{ matrix.cc }} / runtime alone
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libomp-dev

      - name: Configure, build, test, install (SPINGALETT_RUNTIME_ONLY)
        run: |
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DSPINGALETT_RUNTIME_ONLY=ON \
                -DBUILD_WITH_OPENMP=ON -DSPINGALETT_NATIVE_ARCH=OFF -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build Build --parallel
          .github/scripts/ctest.sh --test-dir Build
          cmake --install Build
          find prefix -type f | sort
          test ! -e prefix/include/Spingalett/Spingalett.h && test ! -e prefix/lib/libspingalett.so.1

      - name: Consumer (find_package, pkg-config)
        run: |
          mkdir consumer
          cp Examples/Runtime/RunModel.c consumer/
          printf '%s\n' 'cmake_minimum_required(VERSION 3.21)' 'project(consumer C)' \
            'find_package(Spingalett 1.1 REQUIRED)' 'add_executable(run RunModel.c)' \
            'target_link_libraries(run PRIVATE Spingalett::runtime)' > consumer/CMakeLists.txt
          cmake -S consumer -B consumer/build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_PREFIX_PATH=$PWD/prefix
          cmake --build consumer/build
          consumer/build/run Tests/Data/runtime/resnet_int8.slett
          prefix/bin/RunModel Tests/Data/runtime/graph7_bf16.slett | tail -1
          export PKG_CONFIG_PATH=$PWD/prefix/lib/pkgconfig
          ${{ matrix.cc }} -std=c99 -Wall -Wextra -Wpedantic -Werror -o consumer/pc packaging/conan/test_package/test_runtime.c \
            $(pkg-config --cflags --libs spingalett-runtime) -Wl,-rpath,$PWD/prefix/lib
          consumer/pc

  packages:
    name: Conan and vcpkg recipes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Conan
        run: |
          pipx install conan
          conan profile detect
          conan create packaging/conan --build=missing
          conan create packaging/conan --build=missing -o "&:runtime_only=True"

      - name: vcpkg (overlay port)
        run: |
          vcpkg="$VCPKG_INSTALLATION_ROOT/vcpkg"
          "$vcpkg" install spingalett --triplet x64-linux-dynamic --overlay-ports=packaging/vcpkg
          mkdir consumer
          cp packaging/conan/test_package/test_package.c consumer/
          cp packaging/conan/test_package/test_runtime.c consumer/
          printf '%s\n' 'cmake_minimum_required(VERSION 3.21)' 'project(consumer C)' \
            'find_package(Spingalett CONFIG REQUIRED)' 'add_executable(c test_package.c)' \
            'target_link_libraries(c PRIVATE Spingalett::spingalett)' 'add_executable(r test_runtime.c)' \
            'target_link_libraries(r PRIVATE Spingalett::runtime)' > consumer/CMakeLists.txt
          cmake -S consumer -B consumer/build -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build consumer/build
          (cd consumer && build/c && build/r xor.slett)
          PKG_CONFIG_PATH="$VCPKG_INSTALLATION_ROOT/installed/x64-linux-dynamic/lib/pkgconfig" \
            pkg-config --exists --print-errors spingalett spingalett-runtime

  embedded:
    name: Cortex-M4 (QEMU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Library, ModelTool and MNIST models (dense and convolutional)
        run: |
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_OPENMP=ON -DBUILD_TESTS=OFF
          cmake --build Build --parallel --target MNIST MNIST_CNN ModelTool
          sh Examples/download_mnist.sh data/mnist
          Bin/MNIST data/mnist 3
          Bin/ModelTool eval mnist.slett data/mnist/t10k-images-idx3-ubyte data/mnist/t10k-labels-idx1-ubyte
          Bin/MNIST_CNN data/mnist 1
          Bin/ModelTool eval mnist_cnn.slett data/mnist/t10k-images-idx3-ubyte data/mnist/t10k-labels-idx1-ubyte

      - name: Run on the Cortex-M4 (INT8, INT4; the CNN in INT8)
        run: |
          Examples/Embedded/run-qemu.sh mnist.slett data/mnist --precision int8 --work build/embedded-int8
          Examples/Embedded/run-qemu.sh mnist.slett data/mnist --precision int4 --work build/embedded-int4
          Examples/Embedded/run-qemu.sh mnist_cnn.slett data/mnist --precision int8 --work build/embedded-cnn
