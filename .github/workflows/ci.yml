name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.cc }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        config: [minimal, full, generic]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # glslc and the Vulkan headers build the GPU backend; Mesa's lavapipe (a Vulkan device on
          # the CPU) runs its tests
          sudo apt-get install -y libopenblas-dev libomp-dev python3-numpy libsdl2-dev \
            glslc libvulkan-dev mesa-vulkan-drivers

      - name: Configure
        run: |
          extra="-DBUILD_APPS=ON -DSPINGALETT_VULKAN=ON"
          if [ "${{ matrix.config }}" = full ]; then
            extra="$extra -DBUILD_WITH_OPENMP=ON -DBUILD_WITH_OPENBLAS=ON"
          elif [ "${{ matrix.config }}" = generic ]; then
            # baseline x86-64: the portable code paths, and GEMM kernels chosen at run time
            # (the GEMM test runs the baseline, AVX2 and AVX-512 sets the runner supports)
            extra="$extra -DSPINGALETT_NATIVE_ARCH=OFF -DBUILD_WITH_OPENMP=ON -DBUILD_WITH_OPENBLAS=ON"
          fi
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} $extra

      - name: Build
        run: cmake --build Build --parallel

      - name: Test
        run: ctest --test-dir Build --output-on-failure

      - name: Examples
        working-directory: Bin
        run: |
          ./XOR
          ./DigitPad --help

  sanitizers:
    name: gcc / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Configure
        run: >
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc
          -DBUILD_WITH_OPENMP=ON -DBUILD_WITH_OPENBLAS=ON
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build Build --parallel

      - name: Test
        run: ctest --test-dir Build --output-on-failure

  inference-only:
    name: inference engine alone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The engine as C99, C11 and C17 (gcc, clang)
        run: |
          for cc in gcc clang; do
            for std in c99 c11 c17; do
              $cc -std=$std -Wall -Wextra -Wpedantic -Werror -O2 -DSPINGALETT_INFERENCE_ONLY \
                -IInclude -ISrc -c Src/Spingalett.Inference.c -o /dev/null
            done
          done

      - name: Configure, build, test (SPINGALETT_INFERENCE_ONLY)
        run: |
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DSPINGALETT_INFERENCE_ONLY=ON -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build Build --parallel
          ctest --test-dir Build --output-on-failure
          cmake --install Build

      - name: Consumer (find_package)
        run: |
          mkdir consumer
          printf '%s\n' 'cmake_minimum_required(VERSION 3.21)' 'project(consumer C)' \
            'find_package(Spingalett REQUIRED)' 'add_executable(c main.c)' \
            'target_link_libraries(c PRIVATE Spingalett::spingalett)' > consumer/CMakeLists.txt
          printf '%s\n' '#include <Spingalett/Spingalett.Inference.h>' \
            'int main(void) { SpingalettModel m; return spingalett_model_init(&m, "x", 1) == SPINGALETT_ERR_INVALID ? 0 : 1; }' \
            > consumer/main.c
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH=$PWD/prefix
          cmake --build consumer/build
          consumer/build/c

  embedded:
    name: Cortex-M4 (QEMU)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Library, ModelTool and MNIST models (dense and convolutional)
        run: |
          cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_OPENMP=ON -DBUILD_TESTS=OFF
          cmake --build Build --parallel --target MNIST MNIST_CNN ModelTool
          sh Examples/download_mnist.sh data/mnist
          Bin/MNIST data/mnist 3
          Bin/ModelTool eval mnist.slett data/mnist/t10k-images-idx3-ubyte data/mnist/t10k-labels-idx1-ubyte
          Bin/MNIST_CNN data/mnist 1
          Bin/ModelTool eval mnist_cnn.slett data/mnist/t10k-images-idx3-ubyte data/mnist/t10k-labels-idx1-ubyte

      - name: Run on the Cortex-M4 (INT8, INT4; the CNN in INT8)
        run: |
          Examples/Embedded/run-qemu.sh mnist.slett data/mnist --precision int8 --work build/embedded-int8
          Examples/Embedded/run-qemu.sh mnist.slett data/mnist --precision int4 --work build/embedded-int4
          Examples/Embedded/run-qemu.sh mnist_cnn.slett data/mnist --precision int8 --work build/embedded-cnn
